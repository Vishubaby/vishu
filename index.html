<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Follow Us</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 420px;
      flex-direction: column; /* mobile first */
    }

    .btn {
      width: 100%;
      height: 120px;
      font-size: 26px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
    }

    .youtube {
      background: #ff0000;
    }

    /* Bigger screens */
    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        max-width: 700px;
      }

      .btn {
        height: 140px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Replace the # with your actual Instagram link -->
    <a href="https://www.instagram.com/lahari_bridal_makeover?igsh=ZGliZ3A0NnAzdzht" target="_blank" class="btn instagram">Instagram</a>

    <!-- Replace the # with your actual YouTube link -->
    <a href="https://www.youtube.com/@ShravaniRamakrishna" target="_blank" class="btn youtube">YouTube</a>
  </div>
</body>
</html>
